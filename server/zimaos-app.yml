name: zima-connect

services:
  zima-connect:
    image: ghcr.io/jirkacepelka/zima-connect-server:latest
    pull_policy: always
    container_name: zima-connect
    restart: unless-stopped
    network_mode: host
    volumes:
      - type: bind
        source: /DATA/AppData/zima-connect/data
        target: /data
    environment:
      - ZC_HOUSEHOLD=Home
      - ZC_SERVER_NAME=Zima Connect Hub
      - ZC_DASHBOARD_PORT=9121
    deploy:
      resources:
        reservations:
          memory: 64M

# ZimaOS / CasaOS App Store metadata
x-casaos:
  architectures:
    - amd64
    - arm64
  main: zima-connect
  icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/syncthing.png
  title:
    en_us: Zima Connect
    cs_cz: Zima Connect
  description:
    en_us: Your household hub for Zima Connect. Devices join once and find each other automatically, with per-person rules (for example photos allowed, notifications not). No account, domain or open port needed.
    cs_cz: Domácí server pro Zima Connect. Zařízení se připojí jednou a navzájem se najdou, s pravidly mezi lidmi (třeba fotky ano, notifikace ne). Bez účtu, domény i otevřených portů.
  tagline:
    en_us: KDE Connect for the whole family
    cs_cz: KDE Connect pro celou rodinu
  category: Utilities
  developer: Zima Connect Community
  author: Zima Connect
  version: "0.2.0"
  port_map: "9121"
  scheme: http
  index: /
