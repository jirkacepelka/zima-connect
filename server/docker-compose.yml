# Zima Connect household server.
# Host networking lets devices on your home network find the server directly
# (mDNS); outside the home they reach it through the relay. No open ports,
# no domain and no account are needed. Optional: with a public IP address you can run
# your own relay from the dashboard (Server, Relay); forward TCP port 3340 to this machine.
services:
  zima-connect:
    image: ghcr.io/jirkacepelka/zima-connect-server:latest
    pull_policy: always
    container_name: zima-connect
    restart: unless-stopped
    network_mode: host
    volumes:
      - /DATA/AppData/zima-connect/data:/data
    environment:
      - ZC_HOUSEHOLD=Home
      - ZC_SERVER_NAME=Zima Connect Hub
      - ZC_DASHBOARD_PORT=9121
