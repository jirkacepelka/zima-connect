[package]
name = "zima-connect-android"
description = "JNI bridge: the Zima Connect node for the Android app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "zima_connect_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
zima-connect-net = { path = "../zima-connect-net" }
jni = "0.21.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
