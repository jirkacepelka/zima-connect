[package]
name = "zima-connect-net"
description = "Serverless P2P transport for Zima Connect (iroh: LAN mDNS, hole punching, relay fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
iroh-relay = { version = "1.4.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
# End-to-end sealing of items kept on the server for offline devices
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"

# LocalSend (open protocol, v2): UDP multicast discovery + HTTPS with a self-signed certificate
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
socket2 = { version = "0.6", features = ["all"] }
mime_guess = "2"

# Quick Share (Google/Samsung): mDNS, UKEY2 key exchange (P-256), AES-256-CBC + HMAC messages, protobuf
mdns-sd = "0.13"
prost = "0.13"
p256 = { version = "0.13", features = ["ecdh"] }
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[dev-dependencies]
iroh-relay = { version = "1.4.1", features = ["server"] }
