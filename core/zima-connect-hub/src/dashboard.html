<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Zima Connect</title>
<link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Geist (SIL OFL 1.1, Vercel), served by this server so it works without internet. */
@font-face { font-family: "Geist"; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
/*
  Style: achromatic ledger (seed 96737643). No colour in the chrome; the one data hue
  (--hue) marks who can reach whom; status green only on "online".
  Grid: sidebar 248px, canvas fluid with 32px side padding, content max 1120px.
  Overview row 2: 2fr + 1fr with a 12px gap, both cards end on the canvas edges.
*/
:root {
  color-scheme: light;
  --ground: #f2f4f7;  --sidebar: #f2f4f7;  --surface: #ffffff;  --raised: #f6f7f9;  --active: #e3e6ea;
  --border: #e4e7eb;  --rule: #eef0f3;  --control: #d0d5db;
  --text: #0a0a0a;  --muted: #5f646b;  --faint: #6b7077;
  --primary: #141414;  --primary-ink: #ffffff;  --secondary: #e5e7ea;
  --hue: #1d5fbf;  --hue-pale: #e8eef9;
  --positive: #2e7d32;  --on: #34a853;  --negative: #c4242a;
  --pill-neutral-bg: #eceef1;  --pill-neutral-ink: #3d4148;
  --radius-card: 8px;  --radius-control: 6px;
  --gap: 12px;  --pad: 32px;  --card-pad: 20px;  --row: 48px;  --control-height: 34px;
  --font: "Geist", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --overlay: rgba(10, 12, 16, .32);
  --float: 0 12px 40px rgba(0, 0, 0, .16), 0 0 0 1px rgba(0, 0, 0, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0b0c;  --sidebar: #0b0b0c;  --surface: #141416;  --raised: #1b1b1e;  --active: #26262a;
    --border: #232327;  --rule: #1d1d21;  --control: #3d3d43;
    --text: #f4f4f5;  --muted: #b0b3b8;  --faint: #94979c;
    --primary: #f4f4f5;  --primary-ink: #0a0a0a;  --secondary: #26262a;
    --hue: #6fa0f0;  --hue-pale: #1a2433;
    --positive: #4cc26a;  --on: #4cc26a;  --negative: #ef6b6b;
    --pill-neutral-bg: #26262a;  --pill-neutral-ink: #c9cbcf;
    --overlay: rgba(0, 0, 0, .55);
    --float: 0 12px 40px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .06);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--ground); color: var(--text); font: 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: var(--text); }
:focus-visible { outline: 2px solid var(--hue); outline-offset: 2px; border-radius: 4px; }
svg { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ── shell: open plane ─────────────────────────── */
.shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 20px 12px 16px; border-right: 1px solid var(--border); background: var(--sidebar); }
.mark { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
.mark-glyph { width: 28px; height: 28px; border-radius: 7px; border: 1.5px solid var(--text); display: grid; place-items: center; color: var(--text); }
.mark b { display: block; font-weight: 600; font-size: 14px; }
.mark span { display: block; font-size: 12px; color: var(--muted); }
.nav { flex: 1; overflow-y: auto; }
.nav-group { font-size: 12px; color: var(--muted); padding: 22px 8px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 32px; margin-bottom: 2px; padding: 6px 8px; border-radius: 6px; color: var(--muted); text-align: left; }
.nav-item:hover { background: var(--raised); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--active); color: var(--text); }
.nav-item .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .count { font-size: 12px; color: var(--faint); }
.side-foot { border-top: 1px solid var(--border); padding-top: 10px; }
.topbar { display: none; }

.canvas { min-width: 0; padding: 32px var(--pad) 64px; }
.content { max-width: 1120px; margin: 0 auto; }

/* ── title row ─────────────────────────────────── */
.title-row { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
.title-row h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.01em; }
.title-row .finding { color: var(--muted); margin-top: 4px; font-size: 14px; }
.title-row .actions { margin-left: auto; display: flex; gap: 8px; flex: none; }

/* ── controls ─────────────────────────────────── */
.btn { height: var(--control-height); padding: 0 14px; border-radius: var(--radius-control); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { opacity: .88; }
.btn-secondary { background: var(--secondary); }
.btn-secondary:hover { filter: brightness(.96); }
.btn-danger { color: var(--negative); box-shadow: inset 0 0 0 1px var(--control); background: var(--surface); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link { color: var(--text); font-weight: 500; text-decoration: underline; text-decoration-color: var(--control); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--text); }
.link-danger { color: var(--negative); font-weight: 500; }
.field { width: 100%; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--control); background: var(--surface); }
.field:focus { outline: none; border-color: var(--hue); box-shadow: 0 0 0 3px var(--hue-pale); }
.label { display: block; font-weight: 500; margin-bottom: 8px; }

.banner { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px; margin-bottom: 20px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--surface); }
.banner .grow { flex: 1; min-width: 200px; }
.notes { max-height: 280px; overflow: auto; margin-bottom: 4px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--raised); }
.notes p, .notes h4 { margin: 0 0 6px; }
.notes h4 { font-size: 13px; }
.notes ul { margin: 0 0 6px; padding-left: 18px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--on); }
.switch { position: relative; display: inline-block; width: 32px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; z-index: 1; width: 100%; height: 100%; }
.switch input:disabled { cursor: default; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--control); transition: background .15s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + i { background: var(--on); }
.switch input:checked + i::after { transform: translateX(12px); }
.switch input:disabled + i { opacity: .45; }
.switch input:focus-visible + i { outline: 2px solid var(--hue); outline-offset: 2px; }

/* ── cards ─────────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); }
.card-head { display: flex; align-items: center; gap: 12px; padding: 16px var(--card-pad) 12px; }
.card-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.card-head .meta { margin-left: auto; color: var(--muted); font-size: 12px; }
.row { display: flex; align-items: center; gap: 12px; min-height: var(--row); padding: 10px var(--card-pad); border-top: 1px solid var(--rule); }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--raised); }
.grow { flex: 1; min-width: 0; }
.name { font-weight: 500; }
.sub { color: var(--muted); font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--control); flex: none; }
.dot.on { background: var(--on); }
.pill { font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 4px; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); white-space: nowrap; flex: none; }
.empty-line { padding: 14px var(--card-pad) 18px; color: var(--muted); border-top: 1px solid var(--rule); }
.av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; background: hsl(var(--h) 70% 93%); color: hsl(var(--h) 55% 30%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .av { background: hsl(var(--h) 28% 22%); color: hsl(var(--h) 60% 82%); } }
.devs { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
.dev { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.inv { display: inline-flex; align-items: center; gap: 10px; flex: none; }
.av.s { width: 22px; height: 22px; font-size: 10.5px; }
.av.l { width: 48px; height: 48px; font-size: 18px; }

/* KPI strip: one container split by dividers */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: var(--gap); }
.kpi { padding: 16px var(--card-pad) 18px; }
.kpi + .kpi { border-left: 1px solid var(--border); }
.kpi .k-label { color: var(--muted); font-size: 13px; }
.kpi .k-value { font-size: 30px; line-height: 38px; font-weight: 400; margin-top: 4px; letter-spacing: -.01em; }
.kpi .k-value small { font-size: 16px; color: var(--muted); }
.kpi .k-note { color: var(--muted); font-size: 12px; margin-top: 2px; }

.split { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap); align-items: start; margin-bottom: var(--gap); }


.who { display: inline-flex; align-items: center; gap: 8px; }
.expand-head b { font-weight: 600; }
/* permissions folded under each person on the overview */
.disclose { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border-radius: var(--radius-control); color: var(--muted); font-weight: 500; flex: none; }
.disclose:hover { background: var(--raised); color: var(--text); }
.disclose svg { transition: transform .15s; }
.disclose[aria-expanded="true"] { color: var(--text); }
.disclose[aria-expanded="true"] svg { transform: rotate(180deg); }
.expand { background: var(--raised); border-top: 1px solid var(--rule); padding: 16px var(--card-pad) 20px 64px; display: grid; gap: 16px; }
.expand-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.expand-head .sub { flex: 1; }
@media (max-width: 760px) { .expand { padding-left: var(--card-pad); } }

/* settings: label column + panel */
.section { display: grid; grid-template-columns: 300px 1fr; gap: 32px; padding: 28px 0; border-top: 1px solid var(--border); }
.section:first-of-type { border-top: 0; padding-top: 4px; }
.section h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; line-height: 24px; }
.section .desc { color: var(--muted); }
.panel { min-width: 0; }
.perm-table { width: 100%; border-collapse: collapse; }
.perm-table th, .perm-table td { padding: 10px var(--card-pad); border-top: 1px solid var(--rule); text-align: left; font-weight: 400; }
.perm-table thead th { border-top: 0; color: var(--muted); font-size: 12px; padding-top: 0; }
.perm-table .c { text-align: center; width: 128px; }
.perm-table td.c .switch { vertical-align: middle; }
.kv { display: flex; align-items: center; min-height: var(--row); padding: 10px var(--card-pad); border-top: 1px solid var(--rule); gap: 16px; }
.kv:first-child { border-top: 0; }
.kv .k { flex: 1; }
.kv .v { color: var(--muted); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.id { font-family: var(--mono); font-size: 12.5px; color: var(--muted); word-break: break-all; }
.form { display: grid; gap: 16px; padding: var(--card-pad); }
.err { color: var(--negative); font-size: 13px; min-height: 18px; }

/* first run */
.first { padding: 40px var(--card-pad); display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
.first h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.first p { margin: 0; color: var(--muted); max-width: 560px; }

/* sign in */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.auth { width: 380px; max-width: 100%; }
.auth .mark { padding: 0 0 28px; }
.auth h1 { margin: 0 0 6px; font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; }
.auth p { margin: 0 0 24px; color: var(--muted); }
.auth .stack { display: grid; gap: 14px; }

/* sheet */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: grid; place-items: center; padding: 20px; z-index: 20; animation: fade .12s ease-out; }
.sheet { width: 440px; max-width: 100%; max-height: 92vh; overflow: auto; background: var(--surface); border-radius: 12px; box-shadow: var(--float); padding: 24px; animation: rise .16s ease-out; }
.sheet h3 { margin: 0 0 6px; font-size: 17px; line-height: 24px; font-weight: 600; }
.sheet .lead { margin: 0 0 18px; color: var(--muted); }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.qr { width: 216px; height: 216px; margin: 4px auto 16px; background: #fff; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; }
.qr svg { width: 100%; height: 100%; }
.code { font: 11.5px/17px var(--mono); color: var(--muted); background: var(--raised); border-radius: 6px; padding: 10px 12px; max-height: 72px; overflow: auto; word-break: break-all; user-select: all; }
.steps { margin: 0 0 16px; padding-left: 18px; color: var(--muted); }
.steps li + li { margin-top: 2px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--primary); color: var(--primary-ink); padding: 10px 16px; border-radius: 8px; font-weight: 500; box-shadow: var(--float); z-index: 30; }
.toast.error { background: var(--negative); color: #fff; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ── tablet and phone ─────────────────────────── */
@media (max-width: 1000px) {
  .split { grid-template-columns: 1fr; }
  .section { grid-template-columns: 1fr; gap: 14px; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { display: none; position: fixed; inset: 0; height: auto; z-index: 15; border-right: 0; }
  .side.open { display: flex; }
  .topbar { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--ground); z-index: 5; }
  .topbar b { flex: 1; font-weight: 600; }
  .icon-btn { width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; }
  .canvas { padding: 20px 16px 48px; }
  .title-row { flex-wrap: wrap; }
  .title-row .actions { margin-left: 0; width: 100%; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi:nth-child(3) { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--border); }
  .first { grid-template-columns: 1fr; }
  .perm-table .c { width: 84px; padding-left: 8px; padding-right: 8px; }
  .row, .kv { min-height: 52px; }
}
</style>
</head>

<div id="app"></div>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ICON = {
  overview: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-4H4z"/>',
  server: '<rect x="4" y="4.5" width="16" height="6" rx="1.5"/><rect x="4" y="13.5" width="16" height="6" rx="1.5"/><path d="M8 7.5h.01M8 16.5h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',

  phone: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  laptop: '<rect x="5" y="5" width="14" height="10" rx="1"/><path d="M3 19h18"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M15 9V5.5A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15H9"/>',
};
const icon = (n, s = 16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* What one person may do on another person's devices. The letter is the mark in the matrix. */
const CAPS = [
  { id: 'files', short: 'F', label: 'Files and photos', hint: 'Send a file on purpose' },
  { id: 'clipboard', short: 'C', label: 'Clipboard', hint: 'Send copied text on purpose' },
  { id: 'ring', short: 'R', label: 'Find my device', hint: 'Make the device ring' },
  { id: 'notifications', short: 'N', label: 'Notification mirroring', hint: 'Show notifications automatically' },
  { id: 'calls', short: 'V', label: 'Calls', hint: 'Not available yet' },

const defaultAllowed = (from, to, cap) => from === to || cap === 'files' || cap === 'clipboard' || cap === 'ring';

/* Each person keeps a pale tint of their own hue (identity, not data); neighbours sit far apart on the wheel. */
const HUES = [212, 28, 152, 330, 262, 92, 188, 4];
function tint(user) {
  const i = S.users.findIndex(u => u.id === user.id);
  return `--h:${HUES[(i < 0 ? 0 : i) % HUES.length]}`;
}
const initials = n => String(n).trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
const av = (u, size = '') => `<span class="av ${size}" style="${tint(u)}" aria-hidden="true">${esc(initials(u.name))}</span>`;
const devIcon = p => (p === 'android' || p === 'ios' ? 'phone' : 'laptop');
const PLATFORM = { android: 'Android', ios: 'iOS', windows: 'Windows', linux: 'Linux', macos: 'macOS' };
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fmtBytes = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : n < 1073741824 ? `${(n / 1048576).toFixed(1)} MB` : `${(n / 1073741824).toFixed(2)} GB`;
const fmtUp = s => { const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`; };
const fmtExp = ts => { const s = ts - S.now; if (s <= 0) return 'Expired'; const h = Math.floor(s / 3600); return h >= 1 ? `Expires in ${h} h` : `Expires in ${Math.max(1, Math.floor(s / 60))} min`; };

let S = null, session = null, timer = null, lastSig = '';
const expanded = new Set();   // people whose permissions are open on the overview

function toast(msg, error = false) {

  t.textContent = msg; t.className = 'toast' + (error ? ' error' : ''); t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), error ? 5000 : 2200);

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.status = r.status; throw e; }
  return j;
}
const admin = op => api('/api/admin', { op });
function allowed(from, to, cap) {
  const r = S.rules.find(x => x.from_user === from && x.to_user === to && x.cap === cap);
  return r ? r.allow : defaultAllowed(from, to, cap);
}
const devicesOf = u => S.devices.filter(d => d.user_id === u.id);
const inviteLabel = i => i.label.replace(/^new device for /i, 'Device for ').replace(/^new person: /i, 'New person: ');
const route = () => location.hash.slice(1) || 'overview';

/* ── sign in ─────────────────────────────────── */
function viewAuth() {
  const first = !session.configured;
  $('#app').innerHTML = `<main class="auth-wrap"><form class="auth" id="f">
    <div class="mark"><span class="mark-glyph">${icon('link', 15)}</span><div><b>Zima Connect</b><span>Household server</span></div></div>
    <h1>${first ? 'Set an administrator password' : 'Sign in'}</h1>
    <p>${first ? 'You will use it to add people and devices and to decide what they may do for each other.' : 'Enter the administrator password for this server.'}</p>
    <div class="stack">
      <div><label class="label" for="pw">Password</label><input class="field" id="pw" type="password" autocomplete="${first ? 'new-password' : 'current-password'}" required aria-describedby="pwhint"></div>
      ${first ? '<div><label class="label" for="pw2">Repeat password</label><input class="field" id="pw2" type="password" autocomplete="new-password" required></div><div class="sub" id="pwhint">At least 8 characters.</div>' : ''}
      <div class="err" id="err" role="alert"></div>
      <button class="btn btn-primary" style="height:40px;justify-content:center">${first ? 'Continue' : 'Sign in'}</button>
    </div></form></main>`;
  $('#pw').focus();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const pw = $('#pw').value;
    if (first && pw !== $('#pw2').value) { $('#err').textContent = 'The passwords do not match.'; return; }
    try { await api(first ? '/api/setup' : '/api/login', { password: pw }); if (first) { try { sessionStorage.setItem('zc-onboard', '1'); } catch {} } await boot(); }
    catch (x) { $('#err').textContent = x.message; }
  };
}

/* ── shell ───────────────────────────────────── */
function shell(r, title, body) {
  const pending = S.invites.length;
  const people = S.users.map(u => `<button class="nav-item" data-go="person/${u.id}" ${r === 'person/' + u.id ? 'aria-current="page"' : ''}>${av(u, 's')}<span class="lbl">${esc(u.name)}</span></button>`).join('');
  return `<div class="shell">
    <aside class="side" id="side" aria-label="Navigation">
      <div class="mark"><span class="mark-glyph">${icon('link', 15)}</span><div><b>Zima Connect</b><span>${esc(S.household)}</span></div></div>
      <nav class="nav">
        <button class="nav-item" data-go="overview" ${r === 'overview' ? 'aria-current="page"' : ''}>${icon('overview')}<span class="lbl">Overview</span>${pending ? `<span class="count num" title="Invitations waiting">${pending}</span>` : ''}</button>
        <div class="nav-group">People</div>
        ${people}
        <button class="nav-item" data-action="add-person">${icon('plus')}<span class="lbl">Add person</span></button>
      </nav>
      <div class="side-foot">
        <button class="nav-item" data-go="shelf" ${r === 'shelf' ? 'aria-current="page"' : ''}>${icon('overview')}<span class="lbl">Shelf</span>${S.shelf.length ? `<span class="count num">${S.shelf.length}</span>` : ''}</button>
        <button class="nav-item" data-go="server" ${r === 'server' ? 'aria-current="page"' : ''}>${icon('server')}<span class="lbl">Server</span></button>
        <button class="nav-item" data-action="logout">${icon('out')}<span class="lbl">Sign out</span></button>
      </div>
    </aside>
    <div>
      <header class="topbar"><button class="icon-btn" data-action="menu" aria-label="Menu">${icon('menu', 20)}</button><b>${esc(title)}</b></header>
      <main class="canvas"><div class="content">${updateBanner()}${body}</div></main>
    </div></div>`;
}

/* ── updates ─────────────────────────────────── */
function notesHtml(md) {
  const lines = String(md || '').split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^full changelog/i.test(l) && !/^\*\*full changelog/i.test(l));
  let out = '', list = false;
  for (const l of lines) {
    const item = l.match(/^[-*]\s+(.*)/);
    if (item) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + esc(item[1].replace(/\*\*/g, '').replace(/`/g, '')) + '</li>'; continue; }
    if (list) { out += '</ul>'; list = false; }
    out += /^#+\s/.test(l) ? '<h4>' + esc(l.replace(/^#+\s*/, '')) + '</h4>' : '<p>' + esc(l.replace(/\*\*/g, '').replace(/`/g, '')) + '</p>';
  }
  return out + (list ? '</ul>' : '');
}
function updateBanner() {
  const a = U && U.available;
  if (!a) return '';
  return `<div class="banner" role="status"><div class="grow"><b>Version ${esc(a.latest)} is available</b><span class="sub"> You have ${esc(U.current)}.</span></div>
    <button class="link" data-update-info>What’s new</button>
    ${a.can_install ? '<button class="btn btn-primary" data-update-go>Update and restart</button>' : `<a class="btn btn-secondary" href="${esc(a.page)}" target="_blank" rel="noopener">Open download page</a>`}</div>`;
}
function updateSheet() {
  const a = U && U.available;
  if (!a) return;
  sheet(`<h3>Version ${esc(a.latest)}</h3><p class="lead">You have ${esc(U.current)}. The server keeps your people, devices and settings.</p>
    <div class="notes">${notesHtml(a.notes) || '<p>No release notes.</p>'}</div>
    <div class="sheet-actions"><button class="btn btn-secondary" data-close>Later</button>${a.can_install ? '<button class="btn btn-primary" data-go>Update and restart</button>' : `<a class="btn btn-primary" href="${esc(a.page)}" target="_blank" rel="noopener">Open download page</a>`}</div>`,
  (o, close) => {
    $('[data-close]', o).onclick = close;
    const go = $('[data-go]', o); if (go) go.onclick = () => { o.remove(); installUpdate(); };
  });
}
async function installUpdate() {
  toast('Downloading the update…');
  try { await api('/api/update/install', {}); }
  catch (e) { toast(e.message, true); return; }
  $('#app').insertAdjacentHTML('afterbegin', '<div class="banner" style="margin:16px">Restarting the server…</div>');
  const to = U.available.latest;
  for (let i = 0; i < 60; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try { const st = await fetch('/api/session').then(r => r.json()); if (st) { location.reload(); return; } } catch { /* still restarting */ }
  }
  toast('The server is taking long to restart. Reload this page in a moment.', true);
}
async function checkUpdate() {
  try { U = await api('/api/update/check', {}); render(); toast(U.available ? 'A new version is available' : 'You are up to date'); }
  catch (e) { toast(e.message, true); }
}

function render() {
  if (!S) return;
  let r = route();
  const person = r.startsWith('person/') ? S.users.find(u => 'person/' + u.id === r) : null;
  if (r.startsWith('person/') && !person) r = 'overview';
  const [title, body] = r === 'shelf' ? ['Shelf', pageShelf()] : r === 'server' ? ['Server', pageServer()] : person ? [person.name, pagePerson(person)] : ['Overview', pageOverview()];
  $('#app').innerHTML = shell(r, title, body);
  bind();
}

/* ── overview ────────────────────────────────── */
function pageOverview() {
  const online = S.devices.filter(d => d.online).length;
  const finding = !S.users.length ? 'No one is in the household yet.'
    : !S.devices.length ? `${plural(S.users.length, 'person', 'people')}, no devices yet. Add a device for each person.`
    : `${online} of ${plural(S.devices.length, 'device', 'devices')} online now${S.invites.length ? ` · ${plural(S.invites.length, 'invitation', 'invitations')} not used yet` : ''}${S.queue.items ? ` · ${plural(S.queue.items, 'item', 'items')} waiting for offline devices` : ''}`;

  const head = `<div class="title-row"><div><h1>Overview</h1><div class="finding">${esc(finding)}</div></div>
    <div class="actions"><button class="btn btn-primary" data-action="add-person">${icon('plus', 15)} Add person</button></div></div>`;

  if (!S.users.length) {
    return head + `<section class="card first"><div><h2>Add the people in your home</h2>
      <p>Create a person for everyone, then add their phones and computers with a code. A person’s own devices work together on their own; you decide what people may do on each other’s devices.</p></div>
      <button class="btn btn-primary" data-action="add-person">Add person</button></section>`;
  }

  const kpis = `<section class="card kpis" aria-label="Household at a glance">
    <div class="kpi"><div class="k-label">People</div><div class="k-value num">${S.users.length}</div><div class="k-note">${plural(S.devices.length, 'device', 'devices')} in total</div></div>
    <div class="kpi"><div class="k-label">Devices online</div><div class="k-value num">${online} <small>/ ${S.devices.length}</small></div><div class="k-note">checked every 15 seconds</div></div>
    <div class="kpi"><div class="k-label">Waiting on the server</div><div class="k-value num">${S.queue.items}</div><div class="k-note">${S.queue.items ? `${fmtBytes(S.queue.bytes)}, encrypted for the receiver` : 'nothing for offline devices'}</div></div>
  </section>`;

  const codeFor = u => S.invites.filter(i => i.user === u.id);
  const peopleRows = S.users.map(u => {
    const ds = devicesOf(u), on = ds.filter(d => d.online).length, codes = codeFor(u);
    return `<div class="row">${av(u)}
      <div class="grow"><div class="name"><button class="link" style="text-decoration:none" data-go="person/${u.id}">${esc(u.name)}</button>${u.role === 'owner' ? ' <span class="pill" style="margin-left:6px">Manages household</span>' : ''}</div>
        <div class="devs">${ds.length ? ds.map(d => `<span class="dev"><span class="dot ${d.online ? 'on' : ''}"></span>${esc(d.name)}</span>`).join('') : '<span class="dev">No devices yet</span>'}</div></div>
      ${codes.length ? `<span class="inv"><span class="sub">Code waiting · ${fmtExp(codes[0].expires).toLowerCase()}</span><button class="link" data-show="${codes[0].secret}">Show</button><button class="link-danger" data-revoke="${codes[0].secret}">Cancel</button></span>`
        : `<button class="link" data-adddev="${u.id}">Add device</button>`}
      <span class="status num" style="min-width:76px;justify-content:flex-end">${ds.length ? `${on}/${ds.length} online` : '–'}</span>
      ${S.users.length > 1 ? `<button class="disclose" data-expand="${u.id}" aria-expanded="${expanded.has(u.id)}" aria-controls="perm-${u.id}">Permissions ${icon('chev', 14)}</button>` : ''}</div>
      ${expanded.has(u.id) ? `<div class="expand" id="perm-${u.id}">${S.users.filter(o => o.id !== u.id).map(o => `
        <div class="expand-block"><div class="expand-head"><span class="who">${av(o, 's')}<b>With ${esc(o.name)}</b></span><span class="sub">${summary(u, o)}</span>
          ${isCustom(u, o) ? `<button class="link" data-reset="${u.id}|${o.id}">Back to the default</button>` : ''}</div>
          <div class="card">${permTable(u, o)}</div></div>`).join('')}</div>` : ''}`;
  }).join('');
  const strays = S.invites.filter(i => !i.user).map(i => `<div class="row"><div class="grow"><div class="name">${esc(inviteLabel(i))}</div><div class="sub">${fmtExp(i.expires)}</div></div>
      <button class="link" data-show="${i.secret}">Show</button><button class="link-danger" data-revoke="${i.secret}">Cancel</button></div>`).join('');

  return head + kpis + `<section class="card" style="margin-bottom:var(--gap)" aria-labelledby="h-people"><div class="card-head"><h2 id="h-people">People</h2><span class="meta num">${plural(S.users.length, 'person', 'people')} · ${plural(S.devices.length, 'device', 'devices')}</span></div>${peopleRows}${strays}</section>`;
}

/* What u and o may do on each other's devices: one row per capability, one switch per direction. */
function permTable(u, o) {
  return `<table class="perm-table"><thead><tr><th scope="col">What</th><th scope="col" class="c">${esc(u.name)} → ${esc(o.name)}</th><th scope="col" class="c">${esc(o.name)} → ${esc(u.name)}</th></tr></thead><tbody>
    ${CAPS.map(c => `<tr><td><div class="name">${esc(c.label)}</div><div class="sub">${esc(c.hint)}</div></td>
      <td class="c">${toggle(`rule:${u.id}|${o.id}|${c.id}`, allowed(u.id, o.id, c.id), `${c.label}, ${u.name} to ${o.name}`, c.id === 'calls')}</td>
      <td class="c">${toggle(`rule:${o.id}|${u.id}|${c.id}`, allowed(o.id, u.id, c.id), `${c.label}, ${o.name} to ${u.name}`, c.id === 'calls')}</td></tr>`).join('')}
  </tbody></table>`;
}
const isCustom = (u, o) => S.rules.some(r => (r.from_user === u.id && r.to_user === o.id) || (r.from_user === o.id && r.to_user === u.id));
const summary = (u, o) => isCustom(u, o) ? 'Changed from the default' : 'Default: files, clipboard and Find my device both ways';

/* ── person ──────────────────────────────────── */
function pagePerson(u) {
  const ds = devicesOf(u), on = ds.filter(d => d.online).length;
  const others = S.users.filter(x => x.id !== u.id);
  const head = `<div class="title-row">${av(u, 'l')}<div><h1>${esc(u.name)}</h1>
      <div class="finding num">${ds.length ? `${plural(ds.length, 'device', 'devices')}, ${on} online` : 'No devices yet. Add their phone or computer.'}</div></div>
    <div class="actions"><button class="btn btn-secondary" data-rename="${u.id}">Rename</button><button class="btn btn-primary" data-adddev="${u.id}">${icon('plus', 15)} Add device</button></div></div>`;

  const devices = `<section class="card" aria-labelledby="h-dev"><div class="card-head"><h2 id="h-dev">Devices</h2><span class="meta">their own devices can always use everything together</span></div>
    ${ds.length ? ds.map(d => `<div class="row">${icon(devIcon(d.platform))}
      <div class="grow"><div class="name">${esc(d.name)}</div><div class="sub">${esc(PLATFORM[d.platform] || d.platform)} · <span class="mono" title="${esc(d.id)}">${shortId(d.id)}</span></div></div>
      <span class="status num"><span class="dot ${d.online ? 'on' : ''}"></span>${d.online ? `Online${d.rtt_ms != null ? `, ${d.rtt_ms} ms` : ''}` : 'Offline'}</span>
      <button class="link" data-rendev="${d.id}" data-name="${esc(d.name)}">Rename</button>
      <button class="link-danger" data-rmdev="${d.id}" data-name="${esc(d.name)}">Remove</button></div>`).join('')
      : `<div class="empty-line">${esc(u.name)} has no devices yet. <button class="link" data-adddev="${u.id}">Add a device</button></div>`}
  </section>`;

  const role = `<div class="section"><div><h2>Managing the household</h2><div class="desc">Lets ${esc(u.name)} add people and devices and change permissions from the Zima Connect app, as you can here.</div></div>
    <div class="panel card"><div class="kv"><div class="k"><div class="name">Manages household</div><div class="sub">${u.role === 'owner' ? 'On' : 'Off'}</div></div>${toggle(`role:${u.id}`, u.role === 'owner', `Manages household`)}</div></div></div>`;

  const pairs = others.map(o => {
    const custom = S.rules.some(r => (r.from_user === u.id && r.to_user === o.id) || (r.from_user === o.id && r.to_user === u.id));
    return `<div class="section"><div><h2 class="who">${av(o, 's')}With ${esc(o.name)}</h2>
        <div class="desc">${custom ? 'Changed from the default.' : 'Default: files, clipboard and Find my device both ways.'}</div>
        ${custom ? `<p style="margin:10px 0 0"><button class="link" data-reset="${u.id}|${o.id}">Back to the default</button></p>` : ''}</div>
      <div class="panel card">${permTable(u, o)}</div></div>`;
  }).join('');

  const remove = `<div class="section"><div><h2>Remove ${esc(u.name)}</h2><div class="desc">Their devices are disconnected from everyone and their permissions are deleted. You can add them again later.</div></div>
    <div class="panel"><button class="btn btn-danger" data-rmuser="${u.id}" data-name="${esc(u.name)}">Remove ${esc(u.name)}</button></div></div>`;

  return head + devices + `<div style="margin-top:32px">${role}${pairs}${remove}</div>`;
}

/* ── server ──────────────────────────────────── */
function audienceLabel(a) {
  if (a.to === 'everyone') return 'Everyone';
  return a.ids.map(id => (S.users.find(u => u.id === id) || { name: 'Removed person' }).name).join(', ') || 'Only the sender';
}
function pageShelf() {
  const total = S.shelf.reduce((n, i) => n + i.size, 0);
  return `<div class="title-row"><div><h1>Shelf</h1><div class="finding num">${S.shelf.length ? `${plural(S.shelf.length, 'file', 'files')}, ${fmtBytes(total)}` : 'Nothing on the shelf.'}</div></div></div>
    <section class="card" aria-labelledby="h-shelf"><div class="card-head"><h2 id="h-shelf">Files left for others</h2><span class="meta">kept for 14 days, then removed</span></div>
    ${S.shelf.length ? S.shelf.map(i => `<div class="row">${icon('file')}
      <div class="grow"><div class="name">${esc(i.name)}</div><div class="sub">From ${esc(i.owner_user_name)} for ${esc(audienceLabel(i.audience))} · <span class="num">${fmtBytes(i.size)}</span></div></div>
      <button class="link-danger" data-rmshelf="${i.id}" data-name="${esc(i.name)}">Remove</button></div>`).join('') : '<div class="empty-line">People put files here from the app so others can take them. Unlike the offline queue, the server can read these, like any shared folder.</div>'}
    </section>`;
}
function pageServer() {
  return `<div class="title-row"><div><h1>Server</h1><div class="finding">${S.own_relay.running ? `Your own relay is running at ${esc(S.own_relay.announced || '')}.` : S.relay ? 'Reachable from outside your home through the public relays.' : 'Not connected to the relay: only devices on your home network can reach it.'}</div></div></div>
    <div class="section"><div><h2>Status</h2><div class="desc">The server passes data between devices and keeps items for devices that are offline.</div></div>
      <div class="panel card">
        <div class="kv"><div class="k">Relay</div><span class="status"><span class="dot ${S.relay ? 'on' : ''}"></span>${S.own_relay.running ? 'Your own relay' : S.relay ? 'Public relay' : 'Not connected'}</span></div>
        <div class="kv"><div class="k">Version</div><span class="v num">${esc(S.version)} <button class="link" data-checkupdate style="margin-left:10px">Check for updates</button></span></div>
        <div class="kv"><div class="k">Running for</div><span class="v num">${fmtUp(S.uptime_secs)}</span></div>
        <div class="kv"><div class="k">Waiting for offline devices</div><span class="v num">${plural(S.queue.items, 'item', 'items')}, ${fmtBytes(S.queue.bytes)}</span></div>
      </div></div>
    <div class="section"><div><h2>Relay</h2><div class="desc">Devices outside your home network connect through a relay when a direct connection is not possible. It only forwards encrypted data.</div></div>
      <form class="panel card form" id="rlf">
        <div class="kv"><div class="k">Run a relay on this server<div class="sub">${S.own_relay.running ? `Running at ${esc(S.own_relay.announced || '')}` : 'Off: the public relays of the iroh project are used.'}</div></div>${toggle('relay:on', S.own_relay.enabled, 'Run a relay on this server')}</div>
        ${S.own_relay.enabled ? '' : '<div class="sub" style="padding:0 2px">Turn on if this server has a public IP address and you forwarded a TCP port to it.</div>'}
        ${S.own_relay.enabled ? relayForm('s', null) + '<div style="display:flex;justify-content:flex-end"><button class="btn btn-primary">Save relay</button></div>' : ''}
      </form></div>
    <div class="section"><div><h2>Privacy</h2><div class="desc">What this server can and cannot see.</div></div>
      <div class="panel card"><div class="kv"><div class="k">Items for offline devices are encrypted for the receiving device and signed by the sender, so this server stores them without being able to read them. They are deleted on delivery or after 48 hours. Live transfers go directly between devices whenever possible.</div></div></div></div>
    <div class="section"><div><h2>Server ID</h2><div class="desc">Devices recognise this server by this ID. No account, domain or open port is needed.</div></div>
      <div class="panel card"><div class="kv"><div class="k id">${esc(S.id)}</div><button class="link" data-copyid>Copy</button></div></div></div>
    <div class="section"><div><h2>Administrator password</h2><div class="desc">Used to sign in to this page.</div></div>
      <form class="panel card form" id="pwf">
        <div><label class="label" for="cur">Current password</label><input class="field" type="password" id="cur" autocomplete="current-password"></div>
        <div><label class="label" for="nw">New password</label><input class="field" type="password" id="nw" autocomplete="new-password" aria-describedby="nwhint"><div class="sub" id="nwhint" style="margin-top:6px">At least 8 characters.</div></div>
        <div class="err" id="pwerr" role="alert"></div>
        <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary">Change password</button></div>
      </form></div>`;
}

function toggle(key, on, name, disabled = false) {
  return `<label class="switch"><input type="checkbox" role="switch" data-toggle="${esc(key)}" aria-label="${esc(name)}" ${on ? 'checked' : ''} ${disabled ? 'disabled' : ''}><i></i></label>`;
}

/* ── actions ─────────────────────────────────── */
function bind() {
  $$('[data-go]').forEach(el => {
    el.onclick = () => { location.hash = el.dataset.go; $('#side')?.classList.remove('open'); };
    if (el.getAttribute('role') === 'link') el.onkeydown = e => { if (e.key === 'Enter') el.click(); };
  });
  $$('[data-expand]').forEach(el => el.onclick = () => { const id = el.dataset.expand; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); });
  $$('[data-action="menu"]').forEach(el => el.onclick = () => $('#side').classList.toggle('open'));
  $$('[data-action="add-person"]').forEach(el => el.onclick = addPersonSheet);
  $$('[data-action="logout"]').forEach(el => el.onclick = async () => { await api('/api/logout', {}); location.hash = ''; boot(); });
  $$('[data-adddev]').forEach(el => el.onclick = () => inviteFor(S.users.find(u => u.id === el.dataset.adddev)));
  $$('[data-rename]').forEach(el => el.onclick = () => renameSheet(S.users.find(u => u.id === el.dataset.rename)));
  $$('[data-update-info]').forEach(el => el.onclick = updateSheet);
  $$('[data-update-go]').forEach(el => el.onclick = () => confirmSheet('Update the server?', 'It downloads the new version and restarts. Devices reconnect by themselves within a minute.', 'Update and restart', installUpdate));
  $$('[data-checkupdate]').forEach(el => el.onclick = checkUpdate);
  $$('[data-rmshelf]').forEach(el => el.onclick = () => confirmSheet(`Remove “${el.dataset.name}”?`, 'It disappears from the shelf for everyone.', 'Remove file', async () => { try { await api('/api/shelf/delete', { id: el.dataset.rmshelf }); toast('Removed'); } catch (e) { toast(e.message, true); } refresh(true); }));
  $$('[data-rendev]').forEach(el => el.onclick = () => renameDeviceSheet(el.dataset.rendev, el.dataset.name));
  $$('[data-rmdev]').forEach(el => el.onclick = () => confirmSheet(`Remove “${el.dataset.name}”?`, 'It stops working with the other devices. You can add it again later with a new code.', 'Remove device', () => run({ op: 'remove_device', id: el.dataset.rmdev }, `${el.dataset.name} removed`)));
  $$('[data-rmuser]').forEach(el => el.onclick = () => confirmSheet(`Remove ${el.dataset.name}?`, 'Their devices are disconnected and their permissions are deleted.', `Remove ${el.dataset.name}`, async () => { await run({ op: 'remove_user', id: el.dataset.rmuser }, `${el.dataset.name} removed`); location.hash = 'overview'; }));
  $$('[data-revoke]').forEach(el => el.onclick = () => run({ op: 'revoke_invite', secret: el.dataset.revoke }, 'Invitation cancelled'));
  $$('[data-show]').forEach(el => el.onclick = () => { const i = S.invites.find(x => x.secret === el.dataset.show); if (i) codeSheet(inviteLabel(i), i.code, i.qr); });
  $$('[data-copyid]').forEach(el => el.onclick = () => copyText(S.id, el));
  $$('[data-reset]').forEach(el => el.onclick = async () => {
    const [a, b] = el.dataset.reset.split('|');
    try {
      for (const r of S.rules.filter(r => (r.from_user === a && r.to_user === b) || (r.from_user === b && r.to_user === a))) {
        await admin({ op: 'clear_rule', from_user: r.from_user, to_user: r.to_user, cap: r.cap });
      }
      toast('Back to the default');
    } catch (e) { toast(e.message, true); }
    refresh(true);
  });
  $$('[data-toggle]').forEach(el => el.onchange = () => {
    const [kind, rest] = el.dataset.toggle.split(':');
    if (kind === 'relay') { if (el.checked) { relaySheet(false); el.checked = false; return; } return saveRelay('s', false, document).then(() => {}); }
    if (kind === 'role') return run({ op: 'set_role', id: rest, owner: el.checked }, 'Saved');
    const [from, to, cap] = rest.split('|');
    run(el.checked === defaultAllowed(from, to, cap) ? { op: 'clear_rule', from_user: from, to_user: to, cap } : { op: 'set_rule', from_user: from, to_user: to, cap, allow: el.checked }, 'Saved');
  });
  const rlf = $('#rlf');
  if (rlf) rlf.onsubmit = async e => { e.preventDefault(); await saveRelay('s', true, rlf); };
  const pwf = $('#pwf');
  if (pwf) pwf.onsubmit = async e => {
    e.preventDefault();
    try { await api('/api/password', { current: $('#cur').value, new: $('#nw').value }); $('#cur').value = $('#nw').value = ''; $('#pwerr').textContent = ''; toast('Password changed'); }
    catch (x) { $('#pwerr').textContent = x.message; }
  };
}

async function run(op, ok) {
  try { await admin(op); if (ok) toast(ok); } catch (e) { toast(e.message, true); }
  await refresh(true);
}
async function copyText(text, el) {
  try { await navigator.clipboard.writeText(text); const t = el.textContent; el.textContent = 'Copied'; setTimeout(() => (el.textContent = t), 1400); }
  catch { toast('Select the text and copy it manually', true); }
}

function sheet(html, onOpen) {
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(o);
  const close = () => { o.remove(); document.removeEventListener('keydown', key); render(); };
  const key = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  o.addEventListener('mousedown', e => { if (e.target === o) close(); });
  onOpen(o, close);
}
function addPersonSheet() {
  sheet(`<form id="ap"><h3>Add person</h3><p class="lead">Everyone in your home gets their own person. You will add their phone or computer next.</p>
    <label class="label" for="pn">Name</label><input class="field" id="pn" maxlength="40" autocomplete="off">
    <div class="err" id="aperr" role="alert" style="margin-top:8px"></div>
    <div class="sheet-actions"><button type="button" class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="apgo" disabled>Add person</button></div></form>`,
  (o, close) => {
    const pn = $('#pn', o); pn.focus();
    pn.oninput = () => ($('#apgo', o).disabled = !pn.value.trim());
    $('[data-close]', o).onclick = close;
    $('#ap', o).onsubmit = async e => {
      e.preventDefault();
      try {
        const { id } = await admin({ op: 'create_user', name: pn.value.trim() });
        o.remove();
        await refresh(true);
        location.hash = 'person/' + id;
        inviteFor(S.users.find(u => u.id === id));
      } catch (x) { $('#aperr', o).textContent = x.message; }
    };
  });
}
async function inviteFor(u) {
  try {
    const r = await admin({ op: 'create_invite', user_id: u.id, new_user_name: null });
    await refresh(true);
    codeSheet(`Add a device for ${u.name}`, r.code, r.qr);
  } catch (e) { toast(e.message, true); }
}
function codeSheet(title, code, qr) {
  sheet(`<h3>${esc(title)}</h3>
    <ol class="steps"><li>Install Zima Connect on the phone or computer.</li><li>Choose Add device, then Join server.</li><li>Scan this code, or copy and paste it.</li></ol>
    <div class="qr" role="img" aria-label="QR code">${qr}</div>
    <div class="code">${esc(code)}</div>
    <div class="sub" style="margin-top:8px">Works once and expires in 24 hours.</div>
    <div class="sheet-actions"><button class="btn btn-secondary" data-copy>${icon('copy', 15)} Copy code</button><button class="btn btn-primary" data-close>Done</button></div>`,
  (o, close) => { $('[data-close]', o).onclick = close; $('[data-copy]', o).onclick = e => copyText(code, e.currentTarget); });
}
function renameSheet(u) {
  sheet(`<form id="rn"><h3>Rename ${esc(u.name)}</h3><label class="label" for="rnv">Name</label><input class="field" id="rnv" value="${esc(u.name)}" maxlength="40">
    <div class="sheet-actions"><button type="button" class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary">Save</button></div></form>`,
  (o, close) => {
    const f = $('#rnv', o); f.focus(); f.select();
    $('[data-close]', o).onclick = close;
    $('#rn', o).onsubmit = e => { e.preventDefault(); const n = f.value.trim(); close(); if (n && n !== u.name) run({ op: 'rename_user', id: u.id, name: n }, 'Renamed'); };
  });
}
function renameDeviceSheet(id, current) {
  sheet(`<form id="rd"><h3>Rename device</h3><label class="label" for="rdv">Name</label><input class="field" id="rdv" value="${esc(current)}" maxlength="40">
    <div class="sheet-actions"><button type="button" class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary">Save</button></div></form>`,
  (o, close) => {
    const f = $('#rdv', o); f.focus(); f.select();
    $('[data-close]', o).onclick = close;
    $('#rd', o).onsubmit = e => { e.preventDefault(); const n = f.value.trim(); close(); if (n && n !== current) run({ op: 'rename_device', id, name: n }, 'Renamed'); };
  });
}

/* Own relay: a form used both on the Server page and in the first-run sheet. */
function relayForm(prefix, o) {
  const r = S.own_relay;
  const guess = r.host || (r.detected && r.detected[0]) || '';
  return `<div class="stack">
    <div><label class="label" for="${prefix}host">Public address of this server</label>
      <input class="field" id="${prefix}host" value="${esc(guess)}" placeholder="203.0.113.7 or home.example.org" autocomplete="off" aria-describedby="${prefix}hint">
      <div class="sub" id="${prefix}hint" style="margin-top:6px">${r.detected && r.detected.length ? `Detected: ${esc(r.detected.join(', '))}. ` : ''}The address devices outside your home use to reach this server.</div></div>
    <div><label class="label" for="${prefix}port">Port (TCP)</label><input class="field" id="${prefix}port" type="number" min="1024" max="65535" value="${r.port || 3340}" style="max-width:140px"></div>
    <label class="check"><input type="checkbox" id="${prefix}excl" ${r.exclusive ? 'checked' : ''}> <span>Use only this relay, never the public ones</span></label>
    <div class="err" id="${prefix}err" role="alert"></div></div>`;
}
async function saveRelay(prefix, enabled, root) {
  const q = id => root.querySelector('#' + prefix + id);
  try {
    await api('/api/relay', { enabled, host: enabled ? q('host').value : '', port: Number(q('port').value) || 3340, exclusive: enabled && q('excl').checked });
    toast(enabled ? 'Own relay is running' : 'Using the public relays');
    await refresh(true);
    return true;
  } catch (x) { const e = q('err'); if (e) e.textContent = x.message; return false; }
}
function relaySheet(first) {
  sheet(`<h3>${first ? 'How will devices reach this server?' : 'Run your own relay'}</h3>
    <p class="lead">Devices find each other directly when they can. When they cannot (mobile data, strict networks), traffic goes through a relay. Everything stays end-to-end encrypted, the relay only forwards it. If this server has a public IP address you can be the relay yourself and depend on nobody. You need to forward the TCP port on your router.</p>
    ${relayForm('o', null)}
    <div class="sheet-actions"><button type="button" class="btn btn-secondary" data-close>${first ? 'Use public relays' : 'Cancel'}</button><button type="button" class="btn btn-primary" data-save>Use this server as relay</button></div>`,
  (o, close) => {
    $('[data-close]', o).onclick = close;
    $('[data-save]', o).onclick = async () => { if (await saveRelay('o', true, o)) { o.remove(); render(); } };
  });
}

function confirmSheet(title, text, action, fn) {
  sheet(`<h3>${esc(title)}</h3><p class="lead">${esc(text)}</p>
    <div class="sheet-actions"><button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-danger" data-ok>${esc(action)}</button></div>`,
  (o, close) => { $('[data-close]', o).onclick = close; $('[data-ok]', o).onclick = () => { o.remove(); fn(); }; });
}

/* ── data ────────────────────────────────────── */
let U = null;   // update info from the server
async function refresh(force = false) {
  try {
    S = await api('/api/state');
    try { U = await api('/api/update'); } catch { /* optional */ }
    const { now, uptime_secs, ...rest } = S;           // redraw only when something visible changed
    const sig = JSON.stringify([rest, U]);
    const busy = document.querySelector('.overlay') || document.activeElement?.matches('input:not([type=checkbox])');
    if (force || (!busy && sig !== lastSig)) { lastSig = sig; render(); }
  } catch (e) { if (e.status === 401) boot(); }
}
async function boot() {
  clearInterval(timer);
  try { session = await api('/api/session'); }
  catch { $('#app').innerHTML = '<main class="auth-wrap"><p class="sub">The server is not reachable.</p></main>'; return; }
  if (!session.authed) { viewAuth(); return; }
  await refresh(true);
  timer = setInterval(() => refresh(false), 6000);
  try {
    if (sessionStorage.getItem('zc-onboard')) { sessionStorage.removeItem('zc-onboard'); relaySheet(true); }
  } catch {}
}
addEventListener('hashchange', render);
boot();
</script>
