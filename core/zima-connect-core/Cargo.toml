[package]
name = "zima-connect-core"
description = "Core protocol and cryptography library for Zima Connect"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "zima_connect_core"

[dependencies]
# Cryptography
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# Serialization
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
hex = "0.4"

# Identifiers
uuid = { version = "1", features = ["v7"] }

# Error handling
thiserror = "2"

# Cross-language bindings (UDL/proc-macro wiring deferred)
uniffi = { version = "0.28", optional = true }

# Misc
zeroize = { version = "1", features = ["derive"] }

[features]
default = []
uniffi-bindings = ["dep:uniffi"]

[dev-dependencies]
serde_json = "1"
