name: Core Library CI

on:
  push:
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'

jobs:
  test:
    name: Test Core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check format
        run: cd core && cargo fmt --all -- --check

      - name: Clippy linting
        run: cd core && cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cd core && cargo test --all
