name: Server (hub) image

on:
  push:
    branches: [main]
    paths: ['core/**', 'server/**', '.github/workflows/server.yml']
  pull_request:
    branches: [main]
    paths: ['core/**', 'server/**', '.github/workflows/server.yml']

jobs:
  test:
    name: Test hub and transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cd core && cargo test -p zima-connect-net -p zima-connect-hub

  docker:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version of this build (latest release tag)
        run: echo "ZC_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          build-args: VERSION=${{ env.ZC_VERSION }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/zima-connect-server:latest
            ghcr.io/${{ github.repository_owner }}/zima-connect-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
