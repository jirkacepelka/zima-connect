name: Release

# Push a tag like v0.2.0 to build Windows, Linux and Android and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.2.0) - builds artifacts only'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: 'desktop/src-tauri/target/release/bundle/nsis/*.exe desktop/src-tauri/target/release/bundle/msi/*.msi'
          - name: Linux
            os: ubuntu-22.04
            bundles: 'desktop/src-tauri/target/release/bundle/deb/*.deb desktop/src-tauri/target/release/bundle/rpm/*.rpm desktop/src-tauri/target/release/bundle/appimage/*.AppImage'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          V="${VERSION#v}"
          node -e "
            const fs=require('fs');
            const p='desktop/src-tauri/tauri.conf.json';
            const j=JSON.parse(fs.readFileSync(p));
            j.version='$V';
            fs.writeFileSync(p,JSON.stringify(j,null,2));
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev xdg-utils

      - name: Install frontend dependencies
        run: cd desktop && npm install --no-audit --no-fund

      - name: Build
        run: cd desktop && npx tauri build

      - name: Collect
        run: |
          mkdir -p dist
          V="${VERSION#v}"
          for f in ${{ matrix.bundles }}; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            cp "$f" "dist/${base}"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust node for Android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cd core
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android/app/src/main/jniLibs \
            build --release -p zima-connect-android
          ls -la ../android/app/src/main/jniLibs/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ZC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ZC_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ZC_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ZC_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "persistent=true" >> "$GITHUB_OUTPUT"
          else
            # No stored key: sign with a throw-away key so the APK still installs.
            # Updates over an older install then need an uninstall first.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -storepass zimaconnect \
              -keypass zimaconnect -alias zc -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zima Connect"
            echo "ZC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "ZC_KEYSTORE_PASSWORD=zimaconnect" >> "$GITHUB_ENV"
            echo "ZC_KEY_ALIAS=zc" >> "$GITHUB_ENV"
            echo "ZC_KEY_PASSWORD=zimaconnect" >> "$GITHUB_ENV"
            echo "persistent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          V="${VERSION#v}"
          IFS=. read -r MAJ MIN PAT <<< "${V%%-*}"
          CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          cd android
          gradle --no-daemon :app:assembleRelease -PappVersion="$V" -PappVersionCode="$CODE"

      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/ZimaConnect-${VERSION#v}-android.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  server-binary:
    name: Server binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built in the same Debian image as the container, so running servers can replace
      # their own binary with it ("Update and restart" in the dashboard).
      - name: Build
        run: |
          V="${VERSION#v}"
          docker buildx build -f server/Dockerfile --target binary --build-arg VERSION="$V" \
            --output type=local,dest=out .
          mkdir -p dist
          cp out/zima-connect-hub dist/zima-connect-hub-linux-x86_64
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [desktop, android, server-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      # "What's new" shown in the apps' update dialogs: the commits since the previous release.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Changes since the last *published* release (a tag whose build failed has no release).
          PREV="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          [ "$PREV" = "$VERSION" ] && PREV=""
          [ -n "$PREV" ] || PREV="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}${VERSION}"
          {
            echo "## What's new"
            echo
            git log --no-merges --reverse --pretty=format:'%x01%s%n%b' "$RANGE" \
              | grep -v '^Co-Authored-By' \
              | sed -e 's/^\x01\(feat\|fix\|chore\|docs\|refactor\)\(([^)]*)\)\?: */### /' -e 's/^\x01/### /' \
              | sed '/^$/d'
            echo
          } > notes.md
          sed "s/OWNER/${{ github.repository_owner }}/" .github/release-install.md >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
