[package]
name = "zima-connect-desktop"
version = "0.1.0"
description = "Zima Connect Desktop App for Windows and Linux"
authors = ["Zima Connect Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-shell = "2.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect", "handshake"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }

# Shared Core Protocol & Crypto
zima-connect-core = { path = "../../core/zima-connect-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
